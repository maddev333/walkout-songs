<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Base Hunters — Little League Baseball">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a30"/>
      <stop offset="0.5" stop-color="#1e3c72"/>
      <stop offset="1" stop-color="#2a5298"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#5b83c4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5b83c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#faf8f1"/>
      <stop offset="0.85" stop-color="#ece5d6"/>
      <stop offset="1" stop-color="#d6cbb6"/>
    </radialGradient>
    <radialGradient id="ballRim" cx="50%" cy="50%" r="50%">
      <stop offset="0.80" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2a10" stop-opacity="0.30"/>
    </radialGradient>
    <radialGradient id="ballSpec" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d19a5a"/>
      <stop offset="0.5" stop-color="#a9702f"/>
      <stop offset="1" stop-color="#7d4f1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc107" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffc107"/>
      <stop offset="1" stop-color="#ffc107" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#glow)"/>

  <text x="600" y="52" text-anchor="middle" fill="#c4d8f2"
        font-family="Arial, Helvetica, sans-serif" font-size="23"
        font-weight="700" letter-spacing="13">LITTLE LEAGUE BASEBALL</text>

  <g stroke-linecap="round" stroke-linejoin="round">
       <!-- ground shadow -->
       <ellipse cx="516" cy="338" rx="150" ry="15" fill="#0a1830" opacity="0.35"/>

       <!-- motion / speed lines behind the sprint -->
       <g stroke="#cfe0f7" stroke-width="5" stroke-linecap="round" opacity="0.6">
         <line x1="356" y1="178" x2="432" y2="182"/>
         <line x1="340" y1="216" x2="430" y2="220"/>
         <line x1="360" y1="254" x2="442" y2="256"/>
       </g>

       <!-- dust puff kicked up by the back foot -->
       <g fill="#dfe8f5" opacity="0.6">
         <circle cx="452" cy="330" r="7"/>
         <circle cx="436" cy="336" r="5"/>
         <circle cx="466" cy="338" r="4.5"/>
       </g>

       <!-- home-plate base being hunted (target, upper right) -->
       <g transform="translate(836 150)">
         <line x1="-300" y1="-4" x2="-18" y2="2" stroke="#ffc107" stroke-width="2" stroke-dasharray="4 7" opacity="0.35"/>
         <circle cx="0" cy="0" r="24" fill="none" stroke="#ffc107" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>
         <path d="M -13 -10 L 13 -10 L 13 1 L -13 1 Z M -13 1 L -7 14 L 7 14 L 13 1 Z" fill="none" stroke="#ffc107" stroke-width="2.5" opacity="0.9"/>
       </g>

       <!-- BAT held up like a weapon, raised in the front hand -->
       <g transform="rotate(20 560 152)">
         <path d="M 551 90 Q 560 80 569 90 L 566 158 L 554 158 Z"
              fill="url(#bat)" stroke="#0e1a30" stroke-width="3"/>
         <path d="M 554 96 L 558 154 L 553 154 L 551 96 Z" fill="#f3dcae" opacity="0.45"/>
         <circle cx="560" cy="162" r="6" fill="#8a5320" stroke="#0e1a30" stroke-width="2.5"/>
       </g>

       <!-- STICK limbs: navy outline behind + cream core -->
       <g fill="none" stroke-linecap="round" stroke-linejoin="round">
         <g stroke="#0e1a30" stroke-width="11">
           <path d="M 498 196 L 514 260"/>                              <!-- torso -->
           <path d="M 514 260 L 554 290 L 586 322"/>                   <!-- front leg -->
           <path d="M 514 260 L 480 296 L 448 328"/>                   <!-- back leg -->
           <path d="M 504 208 L 538 184 L 560 152"/>                   <!-- front arm raises bat -->
           <path d="M 504 208 L 474 232 L 454 260"/>                   <!-- back arm -->
         </g>
         <g stroke="#fdf6e9" stroke-width="6">
           <path d="M 498 196 L 514 260"/>
           <path d="M 514 260 L 554 290 L 586 322"/>
           <path d="M 514 260 L 480 296 L 448 328"/>
           <path d="M 504 208 L 538 184 L 560 152"/>
           <path d="M 504 208 L 474 232 L 454 260"/>
         </g>
       </g>

       <!-- shoes on the stick feet -->
       <path d="M 586 322 q 24 -1 28 10 q 2 9 -15 10 l -24 0 q -12 -14 11 -20 z" fill="#14233f" stroke="#0a1428" stroke-width="1.5"/>
       <path d="M 448 328 q -24 -1 -28 10 q -2 9 15 10 l 24 0 q 12 -14 -11 -20 z" fill="#14233f" stroke="#0a1428" stroke-width="1.5"/>

       <!-- fists -->
       <circle cx="560" cy="152" r="10" fill="#fdf6e9" stroke="#14233f" stroke-width="3"/>
       <circle cx="454" cy="260" r="10" fill="#fdf6e9" stroke="#14233f" stroke-width="3"/>

       <!-- BASEBALL HEAD -->
       <circle cx="498" cy="150" r="44" fill="#fdf7ea"/>
       <circle cx="498" cy="150" r="44" fill="url(#ballRim)"/>
       <circle cx="498" cy="150" r="44" fill="none" stroke="#14233f" stroke-width="4.5"/>
       <path d="M 462 114 Q 444 150 462 188" fill="none" stroke="#d8342e" stroke-width="3"/>
       <path d="M 534 114 Q 552 150 534 188" fill="none" stroke="#d8342e" stroke-width="3"/>
       <!-- face: determined, gazing up-right at the base -->
       <circle cx="510" cy="142" r="5.5" fill="#14233f"/>
       <circle cx="532" cy="142" r="5.5" fill="#14233f"/>
       <path d="M 504 162 Q 518 174 534 160" fill="none" stroke="#7a1414" stroke-width="3.5" stroke-linecap="round"/>
   
     </g>

    <text x="600" y="372" text-anchor="middle" fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif" font-size="108"
        font-weight="900" letter-spacing="3">BASE <tspan fill="#ffc107">HUNTERS</tspan></text>

  <rect x="330" y="404" width="540" height="4" rx="2" fill="url(#accent)"/>

  <rect x="7" y="7" width="1186" height="466" rx="14" fill="none"
       stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
