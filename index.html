<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little League Walkout Songs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>⚾ Walkout Songs ⚾</h1>
        <p class="subtitle">Select a player to hear their walkout song!</p>
        
        <div class="player-grid" id="playerGrid">
            <!-- Player buttons will be generated here -->
        </div>

        <div class="current-player" id="currentPlayer">
            <h2>Now Playing:</h2>
            <p id="currentPlayerName">-</p>
            <p id="currentSongTitle">-</p>
        </div>

        <div class="controls" id="controls">
            <button id="playBtn" disabled>▶ Play</button>
            <button id="pauseBtn" disabled>⏸ Pause</button>
            <button id="stopBtn" disabled>⏹ Stop</button>
        </div>

        <div class="announcer-controls">
            <h3>📢 Announcer Settings</h3>
            <div class="control-group">
                <label for="announcerToggle">
                    <input type="checkbox" id="announcerToggle" checked>
                    Enable Announcer
                </label>
            </div>
            <div class="control-group">
                <label for="announcerVoice">Voice:</label>
                <select id="announcerVoice"></select>
            </div>
            <div class="control-group">
                <label for="announcerVolume">Volume: <span id="volumeValue">100%</span></label>
                <input type="range" id="announcerVolume" min="0" max="100" value="100">
            </div>
            <div class="control-group">
                <label for="announcerRate">Speed: <span id="rateValue">1.0x</span></label>
                <input type="range" id="announcerRate" min="0.5" max="1.5" step="0.1" value="1.0">
            </div>
        </div>

        <audio id="audioPlayer"></audio>
    </div>

    <script src="app.js"></script>
</body>
</html>
